<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Inter, Arial, Droid Sans Fallback, WenQuanYi Micro Hei, sans-serif"
>

<text x="85" y="100" font-size="34" font-weight="400" fill="#17202a">ローカル翻訳のご案内</text>
<text x="85" y="175" font-size="30" font-weight="400" fill="#17202a">この文章は端末の中で処理します。</text>
<text x="85" y="245" font-size="30" font-weight="400" fill="#17202a">翻訳する言語を選んでください。</text>
<text x="85" y="315" font-size="30" font-weight="400" fill="#17202a">画像から文字を読み取ります。</text>
<text x="85" y="385" font-size="30" font-weight="400" fill="#17202a">結果を確認してから共有できます。</text>
<text x="85" y="455" font-size="30" font-weight="400" fill="#17202a">静かな場所でも利用できます。</text>
</g>
</svg>

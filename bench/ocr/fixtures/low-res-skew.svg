<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650">
<rect width="100%" height="100%" fill="#ffffff"/>
<g font-family="Inter, Arial, Droid Sans Fallback, WenQuanYi Micro Hei, sans-serif"
 transform="rotate(-4 450 325)">
<rect x="85" y="80" width="650" height="450" fill="#fafafa" stroke="#777"/>
<text x="125" y="130" font-size="22" font-weight="700" fill="#17202a" textLength="205" lengthAdjust="spacingAndGlyphs">FIELD REPORT 07</text>
<text x="125" y="205" font-size="19" font-weight="400" fill="#17202a" textLength="260" lengthAdjust="spacingAndGlyphs">Rain stopped before dawn.</text>
<text x="125" y="265" font-size="19" font-weight="400" fill="#17202a" textLength="250" lengthAdjust="spacingAndGlyphs">The north road is open.</text>
<text x="125" y="325" font-size="19" font-weight="400" fill="#17202a" textLength="265" lengthAdjust="spacingAndGlyphs">Battery level: 82 percent</text>
<text x="125" y="385" font-size="19" font-weight="400" fill="#17202a" textLength="270" lengthAdjust="spacingAndGlyphs">Return by Friday evening.</text>
<text x="125" y="445" font-size="18" font-weight="400" fill="#17202a" textLength="240" lengthAdjust="spacingAndGlyphs">Recorded by M. Tanaka</text>
</g>
</svg>

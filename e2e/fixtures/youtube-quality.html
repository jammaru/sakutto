<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Watch - caption quality fixture</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
      }
      #movie_player {
        position: relative;
        width: 640px;
        height: 360px;
        background: #111;
      }
      .html5-video-container {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
      }
      .html5-main-video {
        width: 100%;
        height: 100%;
      }
      .ytp-caption-window-container {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 80px;
        text-align: center;
        z-index: 20;
      }
      .ytp-caption-segment {
        display: inline-block;
        padding: 4px 10px;
        background: rgb(8 8 8 / 80%);
        color: #fff;
        font: 22px/1.35 sans-serif;
      }
      .ytp-chrome-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 72px;
        z-index: 40;
        pointer-events: auto;
        background: rgb(0 0 0 / 45%);
      }
      #sidebar {
        padding: 12px;
        color: #334;
      }
    </style>
  </head>
  <body>
    <div id="movie_player" class="html5-video-player">
      <div class="html5-video-container">
        <video id="player" class="html5-main-video" controls muted playsinline></video>
      </div>
      <div class="ytp-caption-window-container" lang="ja">
        <span class="ytp-caption-segment" id="native-caption"></span>
      </div>
      <div class="ytp-chrome-bottom" data-sakutto="fake-chrome"></div>
    </div>
    <div id="sidebar">
      <p id="page-decoy">UNRELATED_PAGE_COPY_DECOY_7A3F</p>
      <p>Recommendations and other text that must never leak into a caption line.</p>
    </div>
    <!-- prettier-ignore -->
    <script>
      (function () {
        var lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'ja';
        var ja = [
          [0, 1800, '駅は夜明けに開きます。'],
          [2200, 3900, '赤い列車が2番線で待っています。'],
          [4200, 6000, '切符は北側の窓口で売っています。'],
          [6300, 8000, '次の列車は午後三時に出ます。']
        ];
        var en = [
          [0, 1800, 'The station opens at dawn.'],
          [2200, 3900, 'A red train waits on platform two.'],
          [4200, 6000, 'Tickets are sold near the north gate.'],
          [6300, 8000, 'The next train leaves at three.']
        ];
        var cues = lang === 'ja' ? ja : en;
        var native = document.getElementById('native-caption');
        var video = document.getElementById('player');
        // A blob URL is byte-range seekable in Chromium; the tiny dummy.mp4 has a single
        // keyframe and a plain static server would clamp every seek back to zero.
        var videoReady = fetch('/dummy.mp4')
          .then(function (response) { return response.blob(); })
          .then(function (blob) {
            video.src = URL.createObjectURL(blob);
            video.load();
            return new Promise(function (resolve, reject) {
              if (video.readyState >= 1) return resolve();
              var timer = setTimeout(function () { reject(new Error('video metadata')); }, 5000);
              video.addEventListener('loadedmetadata', function () {
                clearTimeout(timer);
                resolve();
              }, { once: true });
            });
          });
        function paintNative() {
          var ms = video.currentTime * 1000;
          var match = cues.find(function (cue) { return ms >= cue[0] && ms < cue[1]; });
          native.textContent = match ? match[2] : '';
        }
        video.addEventListener('timeupdate', paintNative);
        video.addEventListener('seeked', paintNative);
        paintNative();
        window.__captionQuality = {
          language: lang,
          cues: cues,
          decoy: 'UNRELATED_PAGE_COPY_DECOY_7A3F',
          videoReady: videoReady
        };
        var videoId = lang === 'ja' ? 'qualityja0001' : 'qualityen0001';
        var trackUrl = lang === 'ja' ? '/youtube-quality-ja.json' : '/youtube-quality-en.json';
        window.ytInitialPlayerResponse = {
          videoDetails: {
            videoId: videoId,
            defaultAudioLanguage: lang,
            title: 'Synthetic caption-quality player'
          },
          captions: {
            playerCaptionsTracklistRenderer: {
              captionTracks: [{
                baseUrl: trackUrl,
                languageCode: lang,
                kind: 'asr',
                name: { simpleText: lang === 'ja' ? 'Japanese (auto-generated)' : 'English (auto-generated)' },
                vssId: 'a.' + lang
              }]
            }
          }
        };
      })();
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>App shell</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
        font:
          16px/1.5 Arial,
          sans-serif;
      }
      /* Icon fonts paint a glyph from the word inside the span, not from an image. */
      .material-symbols-outlined {
        font-variant-ligatures: normal;
      }
      /* A carousel slide the host keeps invisible until it is scrolled to. */
      .slide-hidden {
        opacity: 0;
      }
      .disabled-row {
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <!--
      The shape a Svelte/React/Vue app ships: the whole page inside a wrapper that
      generates no box. The bar used to claim the page was translated while every
      paragraph in here stayed English.
    -->
    <div class="hydrated contents" style="display: contents">
      <header>
        <nav aria-label="Main">
          <ul>
            <li><a href="#card">Model card</a></li>
            <li><a href="#files">Files and versions</a></li>
          </ul>
        </nav>
      </header>
      <main>
        <h1 id="title">Diffusion model card</h1>
        <p id="lead">This model converts an autoregressive model into a diffusion model.</p>
        <p id="icon-row">
          Search <span class="material-symbols-outlined" aria-hidden="true">search</span> models
        </p>
      </main>
    </div>
    <aside>
      <div id="downloads">Downloads last month</div>
      <div id="slide" class="slide-hidden">Second slide copy</div>
      <div id="disabled" class="disabled-row">Plan no longer available</div>
    </aside>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>SPA</title>
  </head>
  <body>
    <button id="more" type="button">追加</button>
    <div id="feed">
      <p>最初の段落です。</p>
    </div>
    <script>
      document.getElementById('more').addEventListener('click', () => {
        const paragraph = document.createElement('p');
        paragraph.id = 'added';
        paragraph.textContent = '追加された段落です。';
        document.getElementById('feed').append(paragraph);
      });
    </script>
  </body>
</html>

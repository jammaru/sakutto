<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Watch</title>
    <style>
      #movie_player {
        position: relative;
        width: 960px;
        height: 540px;
        background: #1b3a4b;
      }
      .html5-main-video {
        width: 100%;
        height: 100%;
      }
      .ytp-caption-window-container {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 48px;
        text-align: center;
      }
      .caption-window {
        margin: 0 0 6px;
      }
      .ytp-caption-segment {
        display: inline-block;
        padding: 4px 10px;
        background: rgb(8 8 8 / 80%);
        color: #fff;
        font: 27px/1.35 sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Synthetic YouTube player with an auto-translate window. No people.</p>
    <div id="movie_player" class="html5-video-player">
      <video id="player" class="html5-main-video" controls muted playsinline>
        <source src="/dummy.mp4" type="video/mp4" />
      </video>
      <div class="ytp-caption-window-container">
        <div class="caption-window" lang="en">
          <span class="ytp-caption-segment"
            >the north window sells tickets that do not require a reservation.</span
          >
        </div>
        <div class="caption-window" lang="ja">
          <span class="ytp-caption-segment">北側窓口では予約不要の切符を売っています。</span>
        </div>
      </div>
    </div>
    <!-- prettier-ignore -->
    <script>
      var ytInitialPlayerResponse = {"videoDetails":{"videoId":"fixturemix01","defaultAudioLanguage":"en"},"captions":{"playerCaptionsTracklistRenderer":{"captionTracks":[{"baseUrl":"/missing-timedtext.json","languageCode":"en","name":{"simpleText":"English"},"vssId":".en"}]}}};
    </script>
  </body>
</html>

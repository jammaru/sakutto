<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Repeated phrases</title>
  </head>
  <body>
    <article>
      <p id="haha">Hahaha…</p>
      <p id="no">No, no, no, no, no, no, no, no, no, no, no</p>
      <p id="go">Go! Go! Go! Go! Go! Go! Go! Go! Go! Go!</p>
      <p id="aaah">AAAAH!</p>
      <p id="stars">★★★★★★★★★★★★★★★★</p>
      <p id="dash">ーーーーーーーーーーーーーーーー</p>
      <p id="ellipsis">………………</p>
      <p id="table">|---|---|---|---|---|---|---|---|</p>
      <p id="normal">The team published the paper under an open licence.</p>
    </article>
  </body>
</html>

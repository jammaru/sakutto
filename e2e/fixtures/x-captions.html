<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Station post</title>
  </head>
  <body>
    <p>Synthetic X-shaped timeline. No people and no copyrighted footage.</p>
    <article data-testid="timeline">
      <video
        id="idle"
        controls
        muted
        playsinline
        crossorigin="anonymous"
        width="800"
        height="450"
        style="width: 800px; height: 450px"
      >
        <source src="/dummy.mp4" type="video/mp4" />
        <track kind="subtitles" src="/idle-captions.vtt" srclang="ja" label="Idle" />
      </video>
      <video
        id="playing"
        controls
        muted
        playsinline
        loop
        crossorigin="anonymous"
        width="320"
        height="180"
        style="width: 320px; height: 180px"
      >
        <source src="/dummy.mp4" type="video/mp4" />
        <track
          kind="subtitles"
          src="https://video.twimg.com/subtitles/fixture.vtt"
          srclang="ja"
          label="Japanese"
          default
        />
      </video>
    </article>
  </body>
</html>

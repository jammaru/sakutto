# Canonical labels. Synced by .github/workflows/labels.yml.
# Existing GitHub defaults are listed so their color and description stay stable.

- name: bug
  color: '#d73a4a'
  description: Something isn't working

- name: enhancement
  color: '#a2eeef'
  description: New feature or request

- name: translation-quality
  color: '#c5def5'
  description: 訳文の品質 / Translation quality

- name: performance
  color: '#fbca04'
  description: 速度・負荷 / Performance

- name: documentation
  color: '#0075ca'
  description: Improvements or additions to documentation

- name: i18n
  color: '#1d76db'
  description: 画面の文言 / Interface catalog

- name: good first issue
  color: '#7057ff'
  description: 小さくて着手しやすい。PR 歓迎 / Small first task; PRs welcome

- name: help wanted
  color: '#008672'
  description: 外部の PR を歓迎 / Outside help wanted

- name: needs-triage
  color: '#ededed'
  description: メンテナの確認待ち / Needs maintainer review

- name: question
  color: '#d876e3'
  description: Further information is requested

- name: accessibility
  color: '#f143ab'
  description: Barrier affecting people with disabilities

- name: duplicate
  color: '#cfd3d7'
  description: This issue or pull request already exists

- name: invalid
  color: '#e4e669'
  description: This doesn't seem right

- name: wontfix
  color: '#ffffff'
  description: This will not be worked on

name: Package extension
description: Restore the pinned wllama build or compile it, then zip the extension and smoke-test the worker.

inputs:
  target:
    description: Target browser (chrome or firefox)
    required: false
    default: chrome
  from-source:
    description: Compile wllama from source instead of restoring the Actions cache. Tag releases must set this.
    required: false
    default: 'false'
  skip-wllama:
    description: Use wllama artifacts already on disk (from a previous job in this workflow).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12.15.0

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - if: inputs.skip-wllama != 'true'
      uses: ./.github/actions/build-wllama
      with:
        from-source: ${{ inputs.from-source }}

    - if: inputs.skip-wllama == 'true'
      shell: bash
      run: |
        set -euo pipefail
        node scripts/verify-wllama.mjs
        {
          echo "## Package ${{ inputs.target }}"
          echo ""
          echo "- wllama: restored from the workflow artifact"
          echo "- verified: yes"
        } >> "$GITHUB_STEP_SUMMARY"

    - id: playwright
      if: ${{ inputs.target != 'firefox' }}
      shell: bash
      run: echo "key=playwright-chromium-${RUNNER_OS}-$(sha256sum pnpm-lock.yaml | awk '{print $1}')" >> "$GITHUB_OUTPUT"

    - if: ${{ inputs.target != 'firefox' }}
      shell: bash
      run: pnpm zip

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: pnpm zip:firefox

    - if: ${{ inputs.target != 'firefox' }}
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.playwright.outputs.key }}

    - if: ${{ inputs.target != 'firefox' }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - if: ${{ inputs.target != 'firefox' }}
      shell: bash
      run: pnpm exec playwright test e2e/wllama-worker.spec.ts

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: pnpm lint:firefox

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: |
        set -euo pipefail
        rm -rf /tmp/firefox-mv3-first
        cp -a .output/firefox-mv3 /tmp/firefox-mv3-first
        pnpm zip:firefox
        node scripts/compare-extension-builds.ts /tmp/firefox-mv3-first .output/firefox-mv3

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: |
        set -euo pipefail
        pnpm source:firefox
        rm -rf /tmp/sakutto-firefox-src
        mkdir -p /tmp/sakutto-firefox-src
        python3 - <<'PY'
        from pathlib import Path
        import zipfile
        zipfile.ZipFile('.output/sakutto-firefox-sources.zip').extractall('/tmp/sakutto-firefox-src')
        PY
        mkdir -p /tmp/sakutto-firefox-src/vendor/wllama /tmp/sakutto-firefox-src/public/vendor
        cp -a vendor/wllama/dist /tmp/sakutto-firefox-src/vendor/wllama/dist
        cp -a public/vendor/wllama /tmp/sakutto-firefox-src/public/vendor/wllama
        (
          cd /tmp/sakutto-firefox-src
          pnpm install --frozen-lockfile
          pnpm zip:firefox
        )
        node scripts/compare-extension-builds.ts .output/firefox-mv3 /tmp/sakutto-firefox-src/.output/firefox-mv3

    - shell: bash
      run: node scripts/package-artifact.ts

    - if: ${{ inputs.target != 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: chrome-mv3-zip
        if-no-files-found: error
        compression-level: 0
        path: artifacts/store/*.zip

    - if: ${{ inputs.target != 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: chrome-mv3
        if-no-files-found: error
        compression-level: 0
        include-hidden-files: true
        path: artifacts/chrome-mv3

    - if: ${{ inputs.target == 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: firefox-mv3-zip
        if-no-files-found: error
        compression-level: 0
        path: artifacts/store/*.zip

    - if: ${{ inputs.target == 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: firefox-mv3
        if-no-files-found: error
        compression-level: 0
        include-hidden-files: true
        path: artifacts/firefox-mv3

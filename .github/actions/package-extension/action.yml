name: Package extension
description: Restore the pinned wllama build or compile it, then zip the extension and smoke-test the worker.

inputs:
  target:
    description: Target browser (chrome or firefox)
    required: false
    default: chrome

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 12.15.0

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - id: inputs
      shell: bash
      run: |
        set -euo pipefail
        export LC_ALL=C
        # The generated wllama-worker.js also embeds the Firefox WebGPU kick bootstrap from
        # src/engine/wllama/firefox-webgpu-kick.ts, so a change there must miss the cache.
        hash=$( (find scripts/wllama -type f -print0; printf '%s\0' src/engine/wllama/firefox-webgpu-kick.ts) | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
        tag=$(sed -n "s/^export const EMSDK_TAG = '\\([^']*\\)';/\\1/p" scripts/wllama/pins.ts)
        test -n "$tag"
        lock=$(sha256sum pnpm-lock.yaml | awk '{print $1}')
        {
          echo "hash=$hash"
          echo "tag=$tag"
          echo "playwright=playwright-chromium-${RUNNER_OS}-${lock}"
        } >> "$GITHUB_OUTPUT"

    - id: wasm
      uses: actions/cache/restore@v6
      with:
        path: |
          vendor/wllama/dist
          public/vendor/wllama
        key: wllama-${{ steps.inputs.outputs.hash }}

    - id: image
      if: steps.wasm.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v6
      with:
        path: /tmp/emsdk-image.tar
        key: emsdk-${{ steps.inputs.outputs.tag }}-${{ runner.arch }}

    - if: steps.wasm.outputs.cache-hit != 'true' && steps.image.outputs.cache-hit == 'true'
      shell: bash
      run: docker load --input /tmp/emsdk-image.tar

    - if: steps.wasm.outputs.cache-hit != 'true' && steps.image.outputs.cache-hit != 'true'
      shell: bash
      run: docker pull "emscripten/emsdk:${{ steps.inputs.outputs.tag }}"

    - if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm build:wllama

    - if: steps.wasm.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm verify:wllama

    - if: steps.wasm.outputs.cache-hit != 'true' && steps.image.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        rm -rf vendor/wllama/.checkout/build vendor/wllama/.checkout/build-compat
        docker save "emscripten/emsdk:${{ steps.inputs.outputs.tag }}" --output /tmp/emsdk-image.tar

    - if: steps.wasm.outputs.cache-hit != 'true' && steps.image.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: /tmp/emsdk-image.tar
        key: ${{ steps.image.outputs.cache-primary-key }}

    - if: steps.wasm.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: |
          vendor/wllama/dist
          public/vendor/wllama
        key: ${{ steps.wasm.outputs.cache-primary-key }}

    - if: ${{ inputs.target != 'firefox' }}
      shell: bash
      run: pnpm zip

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: pnpm zip:firefox

    - if: ${{ inputs.target != 'firefox' }}
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.inputs.outputs.playwright }}

    - if: ${{ inputs.target != 'firefox' }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium

    - if: ${{ inputs.target != 'firefox' }}
      shell: bash
      run: pnpm exec playwright test e2e/wllama-worker.spec.ts

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: pnpm lint:firefox

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: |
        set -euo pipefail
        rm -rf /tmp/firefox-mv3-first
        cp -a .output/firefox-mv3 /tmp/firefox-mv3-first
        pnpm zip:firefox
        node scripts/compare-extension-builds.ts /tmp/firefox-mv3-first .output/firefox-mv3

    - if: ${{ inputs.target == 'firefox' }}
      shell: bash
      run: |
        set -euo pipefail
        pnpm source:firefox
        rm -rf /tmp/sakutto-firefox-src
        mkdir -p /tmp/sakutto-firefox-src
        python3 - <<'PY'
        from pathlib import Path
        import zipfile
        zipfile.ZipFile('.output/sakutto-firefox-sources.zip').extractall('/tmp/sakutto-firefox-src')
        PY
        mkdir -p /tmp/sakutto-firefox-src/vendor/wllama /tmp/sakutto-firefox-src/public/vendor
        cp -a vendor/wllama/dist /tmp/sakutto-firefox-src/vendor/wllama/dist
        cp -a public/vendor/wllama /tmp/sakutto-firefox-src/public/vendor/wllama
        (
          cd /tmp/sakutto-firefox-src
          pnpm install --frozen-lockfile
          pnpm zip:firefox
        )
        node scripts/compare-extension-builds.ts .output/firefox-mv3 /tmp/sakutto-firefox-src/.output/firefox-mv3

    - shell: bash
      run: node scripts/package-artifact.ts

    - if: ${{ inputs.target != 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: chrome-mv3-zip
        if-no-files-found: error
        compression-level: 0
        path: artifacts/store/*.zip

    - if: ${{ inputs.target != 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: chrome-mv3
        if-no-files-found: error
        compression-level: 0
        include-hidden-files: true
        path: artifacts/chrome-mv3

    - if: ${{ inputs.target == 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: firefox-mv3-zip
        if-no-files-found: error
        compression-level: 0
        path: artifacts/store/*.zip

    - if: ${{ inputs.target == 'firefox' }}
      uses: actions/upload-artifact@v7
      with:
        name: firefox-mv3
        if-no-files-found: error
        compression-level: 0
        include-hidden-files: true
        path: artifacts/firefox-mv3

name: PR path labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: pull_request_target must not run untrusted PR code.
      # actions/labeler reads .github/labeler.yml from the base branch via the API.
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false

name: Community

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

concurrency:
  group: community-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const sender = context.payload.sender;
            if (!sender || sender.type === 'Bot' || /\[bot\]$/i.test(sender.login)) {
              return;
            }

            const issue = context.payload.issue || context.payload.pull_request;
            if (!issue) return;

            const isPR = Boolean(context.payload.pull_request);
            const { owner, repo } = context.repo;

            if (!isPR) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: ['needs-triage'],
                });
              } catch (error) {
                core.warning(`Could not add needs-triage: ${error.message}`);
              }
            }

            const { data } = await github.rest.issues.listForRepo({
              owner,
              repo,
              creator: issue.user.login,
              state: 'all',
              per_page: 30,
            });

            const previous = data.filter((item) => {
              const itemIsPR = Boolean(item.pull_request);
              return item.number !== issue.number && itemIsPR === isPR;
            });
            if (previous.length > 0) return;

            const issueBody = [
              '初めての Issue をありがとうございます。メンテナが確認します。',
              '',
              '使い方の質問は [Discord](https://discord.gg/pdSRBaSr38) の方が早いことがあります。',
              '非公開のページ本文、認証情報、個人情報は貼らないでください。',
              '',
              'Thank you for your first issue. A maintainer will take a look.',
              'Questions are often faster in [Discord](https://discord.gg/pdSRBaSr38).',
              'Please do not paste private page content, credentials, or personal data.',
            ].join('\n');

            const prBody = [
              '初めての pull request をありがとうございます。小さな修正も歓迎です。',
              '手順は [CONTRIBUTING.md](https://github.com/jammaru/sakutto/blob/main/CONTRIBUTING.md)',
              '（[日本語](https://github.com/jammaru/sakutto/blob/main/CONTRIBUTING.ja.md)）にあります。',
              '',
              'Thank you for your first pull request. Small changes are welcome.',
              'See CONTRIBUTING.md for setup and checks.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: isPR ? prBody : issueBody,
            });
